name: PlantGuard CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q backend/tests

      - name: Build and tag image
        run: |
          docker build -t plantguard:${{ github.sha }} .
          echo "Production artifact prepared for deployment. Registry push would happen if credentials are configured."
